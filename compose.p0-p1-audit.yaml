# Separate P0/P1 audit stack. No active Compose volume/network is referenced.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: toba_p0_p1_audit
      POSTGRES_USER: cp3_demo
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cp3_demo -d toba_p0_p1_audit"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cp3_demo@db:5432/toba_p0_p1_audit
    volumes:
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      backend:
        condition: service_healthy
  etl:
    profiles: [tools]
    build:
      context: ./backend
      dockerfile: Dockerfile.audit
    environment:
      DATABASE_URL: postgresql+psycopg://cp3_demo@db:5432/toba_p0_p1_audit
    volumes:
      - .:/workspace:ro
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, etl.import_data, --synthetic, --dry-run, --summary]
