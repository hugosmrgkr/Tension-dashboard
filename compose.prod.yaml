# P2-06: stack staging/production. Pakai: docker compose --env-file deploy/production.env -f compose.prod.yaml up -d --build
# TIDAK memakai compose.yaml. Tidak ada password default: variabel wajib akan menghentikan compose bila kosong.
# Data aktual TIDAK boleh dimuat sebelum izin dan tata kelola disetujui (lihat docs/P2_DEPLOYMENT_RUNBOOK.md).
name: toba-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toba_health
      POSTGRES_USER: toba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di deploy/production.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toba -d toba_health"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - toba_prod_pgdata:/var/lib/postgresql/data
    networks: [internal]          # tanpa ports: database tidak terbuka ke host maupun internet

  backend:
    build: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./models:/app/models:ro
    environment:
      APP_ENV: ${APP_ENV:-staging}
      AUTH_MODE: token
      VIEWER_TOKEN_SHA256: ${VIEWER_TOKEN_SHA256:?Isi VIEWER_TOKEN_SHA256}
      ADMIN_TOKEN_SHA256: ${ADMIN_TOKEN_SHA256:?Isi ADMIN_TOKEN_SHA256}
      CORS_ORIGINS: ${CORS_ORIGINS:?Isi CORS_ORIGINS (origin https eksplisit)}
      TRUST_PROXY: "true"
      ENABLE_IMPORT: "false"
      DATABASE_URL: postgresql+psycopg://toba:${POSTGRES_PASSWORD}@db:5432/toba_health
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]          # tanpa ports: hanya dapat dijangkau lewat proxy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Isi SITE_ADDRESS (domain staging, atau localhost untuk uji lokal)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend]
    networks: [internal]

networks:
  internal:

volumes:
  toba_prod_pgdata:
  caddy_data:
